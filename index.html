<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>장거리 택시 계산기</title>

 <link rel="manifest" href="manifest.json">

<style>

body{
    font-family: Arial;
    background:#f5f5f5;
    padding:30px;
}

.container{
    max-width:500px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 0 15px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
}

input{
    width:100%;
    padding:15px;
    margin-top:10px;
    margin-bottom:15px;
    font-size:16px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:15px;
    border:none;
    background:black;
    color:white;
    font-size:18px;
    border-radius:10px;
    cursor:pointer;
}

.result{
    margin-top:25px;
    background:#f1f1f1;
    padding:20px;
    border-radius:10px;
    line-height:2;
    font-size:18px;
}

</style>

</head>

<body>

<div class="container">

<h1>🚖 TAXI 거리 계산</h1>

<input type="text" id="start" placeholder="출발지 입력">

<input type="text" id="goal" placeholder="도착지 입력">

<button onclick="calculateDistance()">
거리 확인

</button>

<div class="result" id="result">
결과가 여기에 표시됩니다.
</div>

</div>

<script>

async function calculateDistance(){

    const start = document.getElementById("start").value;
    const goal = document.getElementById("goal").value;


    if(!start || !goal){
        alert("출발지와 도착지를 입력해주세요.");
        return;
    }

    try{

        const response = await fetch(
            
        );

        const data = await response.json();

        if(data.error){
            alert(data.error);
            return;
        }

        document.getElementById("result").innerHTML =
        `
        📍 거리 : <b>${data.distance} km</b><br>
        ⏰ 예상시간 : <b>${data.duration} 분</b><br>
        🛣 통행료 : <b>${data.toll.toLocaleString()} 원</b><br>
        💰 예상요금 : <b>${data.price.toLocaleString()} 원</b>
        `;

    }catch(error){

        console.log(error);

        alert("서버 연결 실패");

    }

}

</script>

</body>

</html>
